<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#08090b" />
    <meta name="description" content="nagyorru" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="nagyorru" />
    <meta property="og:description" content="nagyorru" />
    <meta property="og:url" content="https://ascendo.lol/" />
    <title>nagyorru</title>
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <script>document.documentElement.classList.add('js');</script>
    <link rel="stylesheet" href="./styles.css" />
    <script defer src="./app.js"></script>
  </head>
  <body>
    <div class="backdrop" aria-hidden="true">
      <div class="backdrop__light backdrop__light--one"></div>
      <div class="backdrop__light backdrop__light--two"></div>
      <video id="backgroundVideo" class="backdrop__video" playsinline loop preload="none" aria-hidden="true"></video>
      <div class="backdrop__shade"></div>
      <div class="backdrop__grain"></div>
    </div>

    <section class="entry" id="entry" aria-label="Enter profile">
      <div class="entry__content">
        <div class="avatar avatar--entry">
          <img src="./assets/avatar.svg" alt="" width="88" height="88" />
        </div>
        <p class="entry__name">nagyorru</p>
        <button class="entry__button" id="enterButton" type="button" aria-label="Enter nagyorru's profile">
          <span>enter</span>
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h14M13 6l6 6-6 6" />
          </svg>
        </button>
      </div>
    </section>

    <main id="profile" class="profile" inert aria-hidden="true">
      <div class="profile__content">
        <div class="avatar avatar--profile">
          <img src="./assets/avatar.svg" alt="nagyorru's avatar" width="112" height="112" />
        </div>
        <h1 class="profile__name" id="profileName" tabindex="-1">nagyorru</h1>
        <div class="profile__rule" aria-hidden="true"></div>

        <nav class="socials" aria-label="Social profiles">
          <a class="social" href="https://www.instagram.com/sajtosgofri/" target="_blank" rel="noopener noreferrer" aria-label="Instagram: sajtosgofri (opens in new tab)" title="@sajtosgofri on Instagram">
            <span class="social__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5.4" />
                <circle cx="12" cy="12" r="4.1" />
                <circle cx="17.65" cy="6.5" r="1" fill="currentColor" stroke="none" />
              </svg>
            </span>
            <span class="social__label">instagram</span>
          </a>

          <button class="social" type="button" data-copy="nagyorru" data-service="discord" aria-label="Copy Discord username: nagyorru" title="Copy Discord: nagyorru">
            <span class="social__icon">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M19.73 5.32A18.1 18.1 0 0 0 15.38 4a12.4 12.4 0 0 0-.56 1.13 16.65 16.65 0 0 0-5.02 0A12.4 12.4 0 0 0 9.24 4a18.11 18.11 0 0 0-4.35 1.32C2.13 9.37 1.38 13.33 1.75 17.24a18.2 18.2 0 0 0 5.33 2.72c.42-.57.8-1.18 1.13-1.82-.62-.23-1.21-.52-1.77-.86.15-.11.3-.23.44-.35 3.42 1.59 7.13 1.59 10.51 0 .15.12.3.24.44.35-.56.34-1.15.63-1.77.86.33.64.71 1.25 1.13 1.82a18.19 18.19 0 0 0 5.34-2.72c.43-4.53-.73-8.45-3.5-11.92ZM8.57 14.83c-1.03 0-1.87-.94-1.87-2.09s.83-2.09 1.87-2.09c1.05 0 1.89.95 1.87 2.09 0 1.15-.83 2.09-1.87 2.09Zm6.86 0c-1.03 0-1.87-.94-1.87-2.09s.83-2.09 1.87-2.09c1.05 0 1.89.95 1.87 2.09 0 1.15-.83 2.09-1.87 2.09Z" />
              </svg>
            </span>
            <span class="social__label">discord</span>
          </button>

          <button class="social" type="button" data-copy="nagyorru" data-service="minecraft" aria-label="Copy Minecraft username: nagyorru" title="Copy Minecraft IGN: nagyorru">
            <span class="social__icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true">
                <path d="m12 2.6 9 5.2v8.4l-9 5.2-9-5.2V7.8l9-5.2Z" />
                <path d="m3 7.8 9 5.1 9-5.1M12 12.9v8.5M7.5 5.2l9 5.1" />
              </svg>
            </span>
            <span class="social__label">minecraft</span>
          </button>
        </nav>
      </div>
    </main>

    <button id="soundToggle" class="sound" type="button" aria-label="Mute video sound" hidden>
      <svg class="sound__icon sound__icon--on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M11 5 6.5 9H3v6h3.5L11 19V5ZM15 9a4 4 0 0 1 0 6M18 6a8 8 0 0 1 0 12" />
      </svg>
      <svg class="sound__icon sound__icon--off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
        <path d="M11 5 6.5 9H3v6h3.5L11 19V5ZM16 9l5 6m0-6-5 6" />
      </svg>
      <span id="soundLabel">sound on</span>
    </button>

    <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>
  </body>
</html>
