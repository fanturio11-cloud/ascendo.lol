<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="Ascendo Client">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ascendo">
  <meta property="og:description" content="Ascendo Client 26.3">
  <title>Ascendo</title>
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="./app.js" defer></script>
</head>
<body class="page page--home">
  <main class="landing">
    <div class="landing__inner">
      <img class="brand-logo" src="./assets/ascendo-logo.png" alt="Ascendo" width="1300" height="414" fetchpriority="high">
      <a class="download-button" id="downloadButton" href="#" aria-label="Download Ascendo Client 26.3">
        <svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m-5-5 5 5 5-5M4 18.5v2h16v-2"/></svg>
        <span>Download Ascendo Client 26.3</span>
      </a>
      <section class="founders-section" aria-label="Founders">
        <div class="section-heading"><span>Founders</span></div>
        <div class="founders-list">
          <a class="founder-pill" href="./nagyorru/" aria-label="Open nagyorru's profile">
            <span class="avatar avatar--small">
              <img src="./assets/mypfp-poster.jpg" alt="" width="64" height="64">
              <video class="avatar__video" src="./assets/mypfp.mp4" autoplay muted loop playsinline preload="metadata" poster="./assets/mypfp-poster.jpg" aria-hidden="true"></video>
            </span>
            <span class="founder-pill__name">nagyorru</span>
            <svg class="pill-arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
          </a>
          <a class="founder-pill" href="./k3rlsen/" aria-label="Open k3rlsen's profile">
            <span class="avatar avatar--small"><img src="./assets/k3rlsen-avatar.png" alt="" width="64" height="64"></span>
            <span class="founder-pill__name">k3rlsen</span>
            <svg class="pill-arrow" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14m-6-6 6 6-6 6"/></svg>
          </a>
        </div>
      </section>
    </div>
  </main>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
